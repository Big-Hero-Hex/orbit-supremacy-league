name: OSL · 雲端賽事中心
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Hourly fallback; the separate server-side five-minute clock dispatches
    # normal checks, avoiding dependence on GitHub cron event delivery.
    - cron: '2 * * * *'

concurrency:
  group: osl-broadcast
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  broadcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Read lightweight previous manifest (no recordings)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime site/data
          if gh release view arena-data >/dev/null 2>&1; then
            if gh release download arena-data --pattern manifest.json.gz --dir runtime 2>/dev/null; then
              python -c "import gzip,pathlib; pathlib.Path('site/data/latest.json').write_bytes(gzip.decompress(pathlib.Path('runtime/manifest.json.gz').read_bytes()))"
            else
              gh release download arena-data --pattern site.tar.gz --dir runtime
              tar -xzf runtime/site.tar.gz -C site
            fi
            cp site/data/latest.json runtime/previous_manifest.json
          fi
      - name: Check participant folders and official rule-bot hashes
        id: plan
        run: python arena/plan.py
      - name: Restore recordings only when publication is needed
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view arena-data >/dev/null 2>&1; then
            if [ ! -f runtime/site.tar.gz ]; then gh release download arena-data --pattern site.tar.gz --dir runtime; fi
            tar -xzf runtime/site.tar.gz -C site
          fi
          cp runtime/planned_state.json site/data/latest.json
      - name: Decrypt official fixture on host
        if: steps.plan.outputs.changed == 'true'
        env:
          ARENA_FIXTURE_KEY: ${{ secrets.ARENA_FIXTURE_KEY }}
        run: |
          pip install 'cryptography==46.0.3'
          python arena/decrypt_fixture.py
      - name: Build credential-free evaluation image
        if: steps.plan.outputs.changed == 'true'
        run: docker build --tag osl-worker .
      - name: Run original paired games in isolated container
        if: steps.plan.outputs.publish == 'true'
        run: python arena/run.py
      - name: Update broadcast snapshot
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf runtime/site.tar.gz -C site data
          python -c "import gzip,pathlib; pathlib.Path('runtime/manifest.json.gz').write_bytes(gzip.compress(pathlib.Path('site/data/latest.json').read_bytes()))"
          if ! gh release view arena-data >/dev/null 2>&1; then
            gh release create arena-data --title 'OSL latest broadcast data' --notes 'Current 100-game paired-seat tables, recordings and version history. No model weights.'
          fi
          gh release upload arena-data runtime/site.tar.gz --clobber
          gh release upload arena-data runtime/manifest.json.gz --clobber
      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.publish == 'true'
        with:
          path: site
          retention-days: 1
      - name: Publish OSL
        if: steps.plan.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove old deployment copies after new site is live
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python arena/cleanup_artifacts.py
